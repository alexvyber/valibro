name: Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  V_C_ERROR_BUG_REPORT_DISABLED: '1'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            v_asset: v_linux.zip
          - os: macos-15
            v_asset: v_macos_arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned V release
        env:
          GH_TOKEN: ${{ github.token }}
          V_RELEASE_ASSET: ${{ matrix.v_asset }}
        run: |
          compiler_version="$(tr -d '[:space:]' < .v-version)"
          compiler_dir="$RUNNER_TEMP/valibro-v"
          mkdir -p "$compiler_dir"
          gh release download "$compiler_version" --repo vlang/v --pattern "$V_RELEASE_ASSET" --dir "$compiler_dir"
          unzip -q "$compiler_dir/$V_RELEASE_ASSET" -d "$compiler_dir"
          chmod +x "$compiler_dir/v/v"
          "$compiler_dir/v/v" version
          echo "$compiler_dir/v" >> "$GITHUB_PATH"
      - name: Check module boundaries
        run: v run scripts/check_architecture.vsh
      - name: Verify formatting
        run: v fmt -verify .
      - name: Build and test isolated VPM consumer
        run: v run scripts/check_package.vsh
      - name: Test native core
        run: >-
          v -no-parallel test tests/primitives/primitive_schemas_test.v tests/primitives/numeric_checks_test.v
          tests/collections/collections_test.v tests/json/json_schemas_test.v
          tests/json/json_precision_boundaries_test.v tests/execution/native_api_test.v
          tests/composition/native_union_differential_test.v tests/primitives/native_date_validation_differential_test.v
          tests/engines/url_test.v tests/engines/native_dates_test.v tests/engines/native_regex_test.v
          tests/strings/native_words_test.v tests/strings/unicode_conformance_test.v
          tests/engines/native_cleanup_test.v tests/engines/number_parity_test.v
          tests/primitives/native_array_conversions_test.v tests/engines/native_simplification_test.v
          tests/execution/oracle_metadata_test.v
      - name: Run shipped examples
        run: |
          v -no-parallel run examples/username
          v -no-parallel run examples/strings
          v -no-parallel run examples/primitives
          v -no-parallel run examples/composition
      - name: Check local documentation
        run: |
          VJOBS=1 v -no-parallel test site
          v -no-parallel run site check
          v -no-parallel run site build
